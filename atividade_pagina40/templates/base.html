<!DOCTYPE html>
<html lang="pt-br" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Painel de Tarefas{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

{% if session.usuario_id %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
      <i class="bi bi-check2-square"></i> TaskPanel
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('nova_tarefa') }}"><i class="bi bi-plus-circle"></i> Nova Tarefa</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('progresso') }}"><i class="bi bi-bar-chart-fill"></i> Progresso</a>
        </li>
      </ul>
      <ul class="navbar-nav align-items-center gap-2">
        <li class="nav-item">
          <span class="navbar-text text-white"><i class="bi bi-person-circle"></i> {{ session.usuario_nome }}</span>
        </li>
        <li class="nav-item">
          <button class="btn btn-sm btn-outline-light" id="btn-dark" onclick="toggleDark()">
            <i class="bi bi-moon-fill"></i>
          </button>
        </li>
        <li class="nav-item">
          <a class="btn btn-sm btn-outline-light" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right"></i> Sair</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
{% endif %}

<div class="container py-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
  // Modo escuro persistente
  function applyDark(on) {
    document.getElementById("html-root").setAttribute("data-bs-theme", on ? "dark" : "light");
    const btn = document.getElementById("btn-dark");
    if (btn) btn.innerHTML = on
      ? '<i class="bi bi-sun-fill"></i>'
      : '<i class="bi bi-moon-fill"></i>';
  }
  function toggleDark() {
    const on = localStorage.getItem("darkMode") !== "true";
    localStorage.setItem("darkMode", on);
    applyDark(on);
  }
  applyDark(localStorage.getItem("darkMode") === "true");
</script>
{% block scripts %}{% endblock %}
</body>
</html>
