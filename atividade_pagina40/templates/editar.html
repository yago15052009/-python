{% extends "base.html" %}
{% block title %}Editar Tarefa{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h4 class="mb-4"><i class="bi bi-pencil-square text-primary"></i> Editar Tarefa</h4>
    {% if erro %}<div class="alert alert-danger">{{ erro }}</div>{% endif %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Título *</label>
        <input type="text" name="titulo" class="form-control" value="{{ tarefa.titulo }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Descrição</label>
        <textarea name="descricao" class="form-control" rows="3">{{ tarefa.descricao or '' }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          {% for val, label in [("pendente","Pendente"),("andamento","Em Andamento"),("concluida","Concluída")] %}
          <option value="{{ val }}" {{ 'selected' if tarefa.status == val }}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary"><i class="bi bi-floppy-fill"></i> Atualizar</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
