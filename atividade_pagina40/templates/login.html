{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-body p-4">
        <h4 class="card-title text-center mb-4"><i class="bi bi-lock-fill text-primary"></i> Entrar</h4>
        {% if erro %}<div class="alert alert-danger">{{ erro }}</div>{% endif %}
        <form method="post">
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="senha" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100">Entrar</button>
        </form>
        <hr>
        <p class="text-center mb-0">Não tem conta? <a href="{{ url_for('registro') }}">Registre-se</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
