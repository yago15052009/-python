{% extends "base.html" %}
{% block title %}Nova Tarefa{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h4 class="mb-4"><i class="bi bi-plus-circle-fill text-success"></i> Nova Tarefa</h4>
    {% if erro %}<div class="alert alert-danger">{{ erro }}</div>{% endif %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Título *</label>
        <input type="text" name="titulo" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Descrição</label>
        <textarea name="descricao" class="form-control" rows="3"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          <option value="pendente">Pendente</option>
          <option value="andamento">Em Andamento</option>
          <option value="concluida">Concluída</option>
        </select>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-success"><i class="bi bi-floppy-fill"></i> Salvar</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
