{% extends "base.html" %}
{% block title %}Progresso{% endblock %}
{% block content %}
<h4 class="mb-4"><i class="bi bi-bar-chart-fill text-primary"></i> Progresso das Tarefas</h4>
<div class="row g-4">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h6 class="card-title text-center">Distribuição por Status</h6>
        <canvas id="graficoPizza"></canvas>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h6 class="card-title text-center">Quantidade por Status</h6>
        <canvas id="graficoBarra"></canvas>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  fetch("/api/progresso")
    .then(r => r.json())
    .then(data => {
      const labels = ["Pendente", "Em Andamento", "Concluída"];
      const keys   = ["pendente", "andamento", "concluida"];
      const values = keys.map(k => data[k] || 0);
      const colors = ["#ffc107", "#0d6efd", "#198754"];

      new Chart(document.getElementById("graficoPizza"), {
        type: "pie",
        data: { labels, datasets: [{ data: values, backgroundColor: colors }] }
      });

      new Chart(document.getElementById("graficoBarra"), {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "Tarefas",
            data: values,
            backgroundColor: colors
          }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
      });
    });
</script>
{% endblock %}
